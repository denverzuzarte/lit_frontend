<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Literati — Settings</title>
  <link rel="stylesheet" href="../css/shared.css" />
</head>
<body>

<div style="width: 100%; height: 100vh; position: relative; background: #FDFFF2; overflow: hidden">

  <!-- ── Navbar ── -->
  <div class="navbar">
    <a href="/"><img style="width: 11.41%; height: 11.41vw; left: 0; top: -1.25vw; position: absolute" src="../assets/images/shared/logo.png" /></a>
    <div style="left: 37.97%; top: 1.72vw; position: absolute; color: black; font-size: 5vw; font-family: Italianno, cursive; font-weight: 400; word-wrap: break-word">Why is it a Cog?</div>
    <img style="width: 6.77%; height: 6.77vw; left: 91.25%; top: 1.458vw; position: absolute; object-fit: contain" src="../assets/images/shared/icon-settings.svg" alt="Settings" />
  </div>

  <!-- ── Embedded sidebar ── -->
  <div style="width: 31.25%; height: calc(100vh - 9.64vw); left: 68.75%; top: 9.64vw; position: absolute; background: #DEE7C3; overflow: hidden">
    <div style="width: 88.17%; height: 16.65%; left: 5.17%; top: 2.23%; position: absolute; display: flex; flex-direction: column; justify-content: center; color: black; font-size: 5vw; font-family: Inspiration, cursive; font-weight: 400; word-wrap: break-word">My Profile</div>

    <a href="/books/"       style="width: 100%; height: 10.28%; left: 0; top: 25.47%; position: absolute; text-align: center; display: flex; flex-direction: column; justify-content: center; color: black; font-size: 5vw; font-family: Italianno, cursive; font-weight: 400; text-decoration: none">Book Thingy</a>
    <a href="/peeps/"       style="width: 88.17%; height: 10.28%; left: 5.17%; top: 35.75%; position: absolute; text-align: center; display: flex; flex-direction: column; justify-content: center; color: black; font-size: 5vw; font-family: Italianno, cursive; font-weight: 400; text-decoration: none">Peeps</a>
    <a href="/events/"      style="width: 100%; height: 10.28%; left: 0; top: 46.03%; position: absolute; text-align: center; display: flex; flex-direction: column; justify-content: center; color: black; font-size: 5vw; font-family: Italianno, cursive; font-weight: 400; text-decoration: none">Events</a>
    <a href="/team/"        style="width: 100%; height: 10.28%; left: 0; top: 56.31%; position: absolute; text-align: center; display: flex; flex-direction: column; justify-content: center; color: black; font-size: 5vw; font-family: Italianno, cursive; font-weight: 400; text-decoration: none">Literati's Team</a>
    <a href="/games/"       style="width: 100%; height: 10.28%; left: -0.67%; top: 66.59%; position: absolute; text-align: center; display: flex; flex-direction: column; justify-content: center; color: black; font-size: 5vw; font-family: Italianno, cursive; font-weight: 400; text-decoration: none">Games</a>

    <div style="width: 100%; height: 16.09%; left: -0.67%; top: 76.87%; position: absolute; text-align: center; display: flex; flex-direction: column; justify-content: center; color: black; font-size: 7.5vw; font-family: 'Island Moments', cursive; font-weight: 400; word-wrap: break-word">
      <a href="/literarium/" style="color: black; text-decoration: none">Literarium</a>
    </div>

    <a href="/feedback/"   style="width: 100%; height: 7.37%; left: 0; top: 90.39%; position: absolute; text-align: center; display: flex; flex-direction: column; justify-content: flex-end; color: black; font-size: 1.25vw; font-family: Inter, sans-serif; font-weight: 400; text-decoration: none">Feedback or report bugs</a>

    <a href="/profile/"><img style="width: 24%; height: 16.65%; left: 65.67%; top: 2.23%; position: absolute; border-radius: 9999px; object-fit: cover" src="../assets/images/shared/avatar-default.png" alt="Profile" /></a>
  </div>

  <!-- ── Dark Mode setting ── -->
  <div style="width: 17.97%; height: 3.958vw; left: 1.406%; top: 12.97vw; position: absolute; background: #DAD7DD; border-radius: 19px"></div>
  <div style="left: 2.76%; top: 13.75vw; position: absolute; color: black; font-size: 2.08vw; font-family: Inter, sans-serif; font-weight: 400">Dark Mode</div>
  <img id="dark-mode-toggle" style="width: 3.125%; height: 2.5vw; left: 14.948%; top: 14.17vw; position: absolute; cursor: pointer" src="../assets/images/shared/icon-switch.svg" alt="Toggle dark mode" />

</div>

</body>
</html>
