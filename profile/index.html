<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Literati — My Profile</title>
  <link rel="stylesheet" href="../css/shared.css" />
  <link rel="stylesheet" href="../css/profile.css" />
</head>
<body>

<div style="width: 100%; min-height: 164.64vw; position: relative; background: #FDFFF2; overflow: hidden">

  <!-- ── Header / Nav ── -->
  <div class="navbar">
    <a href="/"><img style="width: 11.41%; height: 11.41vw; left: 0; top: -1.25vw; position: absolute" src="../assets/images/shared/logo.png" onerror="this.src='https://placehold.co/219x219'" /></a>
    <div style="width: 67.55%; height: 6.25vw; left: 16.20%; top: 1.72vw; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; color: black; font-size: 5vw; font-family: Italianno, cursive; font-weight: 400; word-wrap: break-word">NO.</div>
    <img id="sidebar-toggle" style="width: 11.46%; height: 6.25vw; left: 88.54%; top: 1.72vw; position: absolute; cursor: pointer" src="../assets/images/shared/icon-hamburger.png" alt="Open menu" />
  </div>

  <!-- ── Profile picture ── -->
  <img style="width: 10.36%; height: 10.36vw; left: 5.73%; top: 11.67vw; position: absolute; box-shadow: 0px 6px 4px 3px black, 0px 4px 4px black inset; border-radius: 9999px; object-fit: cover" src="https://placehold.co/199x199" />

  <!-- ── User info ── -->
  <div style="width: 15.10%; height: 10.94vw; left: 17.55%; top: 11.67vw; position: absolute; justify-content: center; display: flex; flex-direction: column; color: black; font-size: 3.33vw; font-family: Italianno, cursive; font-weight: 400; word-wrap: break-word; text-shadow: 0px 4px 4px rgba(0,0,0,0.25)">Denver Zuzarte<br />&nbsp;&nbsp;24B1843<br />Denver</div>

  <!-- ── Stats (top-right) ── -->
  <div class="stat-pill" style="top: 10.625vw">Books Shared : <span id="stat-books-shared">0</span></div>
  <div class="stat-pill" style="top: 15.052vw">Books Borrowed : <span id="stat-books-borrowed">0</span></div>
  <div class="stat-pill" style="top: 19.479vw">Friends : <span id="stat-friends">0</span></div>

  <!-- ── Horizontal divider ── -->
  <div style="width: 93.75%; height: 0; left: 3.125%; top: 24.64vw; position: absolute; outline: 8px rgba(228, 117, 199, 0.24) solid; outline-offset: -4px"></div>

  <!-- ── MY BOOKS section ── -->
  <div style="left: 5.83%; top: 27.66vw; position: absolute; justify-content: center; display: flex; flex-direction: column; color: black; font-size: 3.33vw; font-family: Italianno, cursive; font-weight: 400; word-wrap: break-word">MY&nbsp;&nbsp;&nbsp;BOOKS</div>

  <!-- Books expand arrow -->
  <img src="../assets/images/shared/icon-arrow-down.svg" style="width: 5vw; height: 5vw; left: 21.56%; top: 26.82vw; position: absolute" alt="" />

  <!-- ── My Friends section ── -->
  <div style="left: 48.91%; top: 27.66vw; position: absolute; justify-content: center; display: flex; flex-direction: column; color: black; font-size: 3.33vw; font-family: Italianno, cursive; font-weight: 400; word-wrap: break-word">My&nbsp;&nbsp;Friends</div>

  <!-- Friends expand arrow -->
  <img src="../assets/images/shared/icon-arrow-down.svg" style="width: 5vw; height: 5vw; left: 61.67%; top: 27.24vw; position: absolute" alt="" />

  <!-- ── Action buttons ── -->
  <div style="width: 19.69%; height: 4.17vw; left: 27.08%; top: 27.66vw; position: absolute; background: #DAD7DD; box-shadow: 0px 4px 4px rgba(0,0,0,0.25); border-radius: 20px"></div>
  <div style="width: 20.35%; height: 4.74vw; left: 31.25%; top: 27.66vw; position: absolute; justify-content: center; display: flex; flex-direction: column; color: black; font-size: 3.33vw; font-family: Italianno, cursive; font-weight: 400; word-wrap: break-word">Add a Book</div>

  <div style="width: 19.69%; height: 4.17vw; left: 27.08%; top: 32.60vw; position: absolute; background: #DAD7DD; box-shadow: 0px 4px 4px rgba(0,0,0,0.25); border-radius: 20px"></div>
  <div style="width: 20.07%; height: 5vw; left: 27.36%; top: 32.40vw; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; color: black; font-size: 3.33vw; font-family: Italianno, cursive; font-weight: 400; word-wrap: break-word">Add a Friend</div>

  <div style="width: 19.69%; height: 4.17vw; left: 27.08%; top: 37.60vw; position: absolute; background: #DAD7DD; box-shadow: 0px 4px 4px rgba(0,0,0,0.25); border-radius: 20px"></div>
  <div style="left: 30.94%; top: 37.60vw; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; color: black; font-size: 3.33vw; font-family: Italianno, cursive; font-weight: 400; word-wrap: break-word">Add a Game</div>

  <!-- ── Cog → settings ── -->
  <a href="/settings/" style="width: 3.23vw; height: 3.23vw; left: 29.43%; top: 15.52vw; position: absolute; display: block">
    <img src="../assets/images/shared/icon-cog.svg" style="width: 100%; height: 100%" alt="Settings" />
  </a>

  <!-- ── Pencil — edit name ── -->
  <img src="../assets/images/shared/icon-pencil.svg" style="width: 2.19vw; height: 1.875vw; left: 33.02%; top: 11.67vw; position: absolute" alt="Edit name" />

  <!-- ── Pencil — edit profile detail ── -->
  <img src="../assets/images/shared/icon-pencil.svg" style="width: 2.19vw; height: 1.875vw; left: 25.47%; top: 20.573vw; position: absolute" alt="Edit" />

</div>

<script src="../js/main.js"></script>
<script src="../js/profile.js"></script>
</body>
</html>
