<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Literati — Book Thingy</title>
  <link rel="stylesheet" href="../css/shared.css" />
</head>
<body>

<div style="width: 100%; min-height: 164.64vw; position: relative; background: #FDFFF2; overflow: hidden">

  <!-- ── Navbar ── -->
  <div class="navbar">
    <a href="/"><img style="width: 11.41%; height: 11.41vw; left: 0; top: -1.25vw; position: absolute" src="../assets/images/shared/logo.png" /></a>
    <div style="width: 67.55%; height: 6.25vw; left: 16.20%; top: 1.72vw; position: absolute; text-align: center; justify-content: center; display: flex; flex-direction: column; color: black; font-size: 5vw; font-family: Italianno, cursive; font-weight: 400; word-wrap: break-word">Random Thing From the List</div>
    <img id="sidebar-toggle" style="width: 11.46%; height: 6.25vw; left: 88.54%; top: 1.72vw; position: absolute; cursor: pointer; object-fit: contain" src="../assets/images/shared/icon-hamburger.png" alt="Open menu" />
  </div>

  <!-- ── Search bar ── -->
  <div style="width: 73.39%; height: 7.29vw; left: 7.55%; top: 11.67vw; position: absolute; background: #D9D9D9; border-radius: 30px"></div>

  <!-- Search placeholder text -->
  <div style="left: 9.11%; top: 13.07vw; position: absolute; display: flex; flex-direction: column; justify-content: center; color: black; font-size: 3.33vw; font-family: 'IBM Plex Mono', monospace; font-weight: 400; word-wrap: break-word">Search by book/author/friend</div>

  <!-- Search icon (right end of search bar) -->
  <img style="width: 5.57%; height: 5.57vw; left: 73.28%; top: 12.50vw; position: absolute" src="../assets/images/shared/icon-search.svg" alt="Search" />

  <!-- ── Filter button ── -->
  <div style="width: 9.58%; height: 7.29vw; left: 83.75%; top: 11.67vw; position: absolute; background: #D9D9D9; border-radius: 30px"></div>
  <img style="width: 6.30%; height: 6.30vw; left: 85.36%; top: 12.14vw; position: absolute; object-fit: contain" src="../assets/images/books/icon-filter.png" alt="Filter" />

</div>

<script src="../js/main.js"></script>
</body>
</html>
